name: orllm
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.3
  - torchvision
  - torchaudio
  - pyyaml>=6.0
  - requests>=2.32
  - tqdm>=4.66
  - matplotlib>=3.8
  - pip:
      - ortools>=9.10
      - typer>=0.12.3
      - transformers>=4.44.0
      - datasets>=2.20.0
      - accelerate>=0.33.0
      - peft>=0.12.0
      - trl>=0.10.1
      - sentencepiece>=0.2.0
      - bitsandbytes>=0.43.1; platform_system != "Windows"
      - -e .
