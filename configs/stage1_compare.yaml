run_root: runs
run_prefix: model_compare
teacher_evaluation: true
benchmark:
  seed: 2026
  target_questions: 50
  max_seed_problems: 50
  question_variants_per_seed: 1
  include_canonical_question: false
  question_rewrite_styles:
    - operations memo
    - planner handoff
    - procurement brief
  question_rewrite_temperature: 0.6
  question_rewrite_max_tokens: 1000
  template_weights:
    resource_allocation: 1
    production_planning: 1
    assignment: 1
    knapsack: 1
    tsp: 1
rollout:
  num_return_sequences: 3
  max_new_tokens: 900
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  load_in_4bit: false
  timeout_seconds: 20
  seed: 2026
models:
  - name: base
    model_path: models/Qwen2.5-1.5B-Instruct
    is_adapter: false

  - name: sft
    model_path: outputs/qwen2.5-1.5b-stage1-lora_runs/sft_train_20260414_224817/weights/final_adapter
    base_model_path: models/Qwen2.5-1.5B-Instruct
    is_adapter: true

  - name: dpo
    model_path: outputs/qwen2.5-1.5b-stage1-dpo_runs/dpo_train_conservative_20260416_105705/weights/final_adapter
    base_model_path: models/Qwen2.5-1.5B-Instruct
    is_adapter: true
