run_root: runs
run_prefix: model_compare_7b
teacher_evaluation: false

benchmark:
  teacher_backend: qwen_rag
  teacher_model_path: models/Qwen2.5-7B-Instruct
  teacher_load_in_4bit: false
  rag_index_dir: data/rag/or_books
  rag_candidate_top_k: 30
  rag_top_k: 5
  rag_max_context_chars: 5000
  rag_use_semantic_rerank: true
  rag_reranker_model: BAAI/bge-reranker-base
  rag_reranker_batch_size: 16
  rag_reranker_max_length: 512
  rag_use_query_rewrite: false
  rag_fail_on_reranker_error: false
  seed: 2026
  target_questions: 120
  max_seed_problems: 120
  question_variants_per_seed: 2
  include_canonical_question: true
  question_rewrite_styles:
    - operations memo
    - planner handoff
    - procurement brief
    - classroom modeling exercise
    - internal analytics request
  question_rewrite_temperature: 0.45
  question_rewrite_max_tokens: 700
  trajectory_top_p: 0.92
  trajectory_repetition_penalty: 1.03
  template_weights:
    resource_allocation: 1
    production_planning: 1
    assignment: 1
    knapsack: 1
    tsp: 1

rollout:
  num_return_sequences: 4
  max_new_tokens: 1000
  temperature: 0.3
  top_p: 0.92
  do_sample: true
  load_in_4bit: false
  timeout_seconds: 30
  seed: 2026

models:
  - name: base
    model_path: models/Qwen2.5-7B-Instruct
    is_adapter: false

  - name: sft
    model_path: outputs/qwen2.5-7b-stage1-lora
    base_model_path: models/Qwen2.5-7B-Instruct
    is_adapter: true

  - name: dpo
    model_path: outputs/qwen2.5-7b-stage1-dpo
    base_model_path: models/Qwen2.5-7B-Instruct
    is_adapter: true
