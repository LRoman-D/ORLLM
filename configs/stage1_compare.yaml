run_root: runs
run_prefix: compare_qwen3_8b
teacher_evaluation: false

benchmark:
  dataset_path: data/external_or/splits/eval_questions.jsonl
  seed: 2026
  target_questions: 80

rollout:
  num_return_sequences: 4
  max_new_tokens: 1800
  temperature: 0.3
  top_p: 0.92
  do_sample: true
  load_in_4bit: true
  timeout_seconds: 35
  seed: 2026
  genprm_evaluation: false

models:
  - name: qwen3_base
    model_path: models/Qwen3-8B
    is_adapter: false

  - name: qwen3_sft
    model_path: artifacts/qwen3-8b/sft-lora
    base_model_path: models/Qwen3-8B
    is_adapter: true

  - name: qwen3_dpo
    model_path: artifacts/qwen3-8b/dpo-lora
    base_model_path: models/Qwen3-8B
    is_adapter: true
