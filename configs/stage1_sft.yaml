model_name_or_path: models/Qwen3-8B
dataset_path: data/processed/qwen3_sft/train.jsonl
output_dir: artifacts/qwen3-8b/sft-lora
run_root: runs
run_prefix: sft_qwen3_8b
update_latest_symlink: true

max_seq_length: 3072
learning_rate: 8.0e-5
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
logging_steps: 1
save_steps: 20
save_total_limit: 4
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
load_in_4bit: true
use_bf16_if_available: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optim: paged_adamw_8bit
warmup_steps: 8
lr_scheduler_type: cosine
max_grad_norm: 0.3
resume_from_checkpoint: true
