seed: 2026
teacher_backend: qwen_rag
teacher_model_path: models/Qwen2.5-7B-Instruct
teacher_load_in_4bit: true
use_bf16_if_available: true
rag_index_dir: data/rag/or_books
rag_top_k: 4
rag_max_context_chars: 5000

target_verified_samples: 120
max_seed_problems: 240
verbose_generation: true
question_variants_per_seed: 2
include_canonical_question: false
question_rewrite_styles:
  - operations memo
  - planner handoff
  - procurement brief
  - classroom modeling exercise
  - internal analytics request
  - field dispatch note
question_rewrite_temperature: 0.75
question_rewrite_max_tokens: 900
trajectories_per_variant: 2
trajectory_temperatures: [0.2, 0.55]
trajectory_max_tokens: 1800
timeout_seconds: 20
output_dir: data/processed/stage1_dataset
resume_from_checkpoint: true
pending_records_file: accepted_pending.jsonl
state_file: generation_state.json
trace_file: generation_trace.jsonl
splits:
  train: 1.0
template_weights:
  resource_allocation: 1
  production_planning: 1
  assignment: 1
  knapsack: 1
  tsp: 1
