seed: 2026
external_data_dir: data/external_or
sft_source_dir: data/external_or/sft_teacher

# Questions and reference answers are downloaded from the external channels only.
# Inaccessible channels are skipped and reported in data/external_or/summary.json.
max_rows_per_source: 0
splits:
  sft: 0.6
  rollout: 0.2
  eval: 0.2

# SFT responses are generated for external SFT questions, then verified against
# the external reference answer before they enter data/external_or/sft_teacher.
build_sft_trajectories: true
sft_response_mode: teacher_verified
max_sft_samples: 0
resume_from_checkpoint: true
sft_source_priority:
  - MAMO Easy
  - NL4Opt
  - ComplexOR
  - IndustryOR
  - ReSocratic
  - MAMO Complex

teacher_backend: qwen_rag
teacher_model_path: models/Qwen3-8B
teacher_load_in_4bit: true
teacher_enable_thinking: false
use_bf16_if_available: true

rag_index_dir: data/rag/or_books
rag_candidate_top_k: 40
rag_top_k: 5
rag_max_context_chars: 4200
rag_context_max_chunk_chars: 900
rag_context_include_scores: false
rag_use_semantic_rerank: true
rag_reranker_model: models/msmarco-minilm-reranker
rag_reranker_batch_size: 16
rag_reranker_max_length: 256
rag_rerank_keyword_blend: 0.62
rag_modeling_boost: 0.12
rag_use_query_rewrite: false
rag_fail_on_reranker_error: false

genprm_evaluation: false
genprm_min_correct_steps: 8
genprm_require_all_correct: false
genprm_max_tokens: 4200

trajectories_per_question: 2
trajectory_temperatures: [0.25, 0.25]
trajectory_top_p: 0.9
trajectory_repetition_penalty: 1.03
trajectory_max_tokens: 2200
timeout_seconds: 35
verification_relative_tolerance: 0.05
