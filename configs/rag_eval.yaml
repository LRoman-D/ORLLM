index_dir: data/rag/or_books
candidate_top_k: 25
top_k: 5
use_semantic_rerank: true
reranker_model: models/msmarco-minilm-reranker
reranker_batch_size: 8
reranker_max_length: 512
use_query_rewrite: false
fail_on_reranker_error: false
output_path: data/rag/or_books/retrieval_eval.json
probes:
  - name: linear_programming
    query: linear programming decision variables objective function constraints production planning resource allocation
    expected_terms: [linear, programming, objective, constraints]
  - name: integer_programming
    query: integer programming binary variables assignment knapsack combinatorial optimization
    expected_terms: [integer, binary, assignment, knapsack]
  - name: tsp_routing
    query: traveling salesman routing tour subtour elimination route optimization
    expected_terms: [traveling, salesman, tour, subtour]
  - name: convex_feasibility
    query: convex optimization feasible set optimal solution duality constraints
    expected_terms: [convex, feasible, optimal, duality]
