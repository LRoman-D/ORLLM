run_root: runs
run_prefix: model_compare_7b_300
teacher_evaluation: false

benchmark:
  seed: 2026
  target_questions: 300
  max_seed_problems: 300
  question_variants_per_seed: 1
  include_canonical_question: false
  question_rewrite_styles:
    - operations memo
    - planner handoff
    - procurement brief
  question_rewrite_temperature: 0.6
  question_rewrite_max_tokens: 1000
  template_weights:
    resource_allocation: 1
    production_planning: 1
    assignment: 1
    knapsack: 1
    tsp: 1

rollout:
  num_return_sequences: 2
  max_new_tokens: 700
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  load_in_4bit: true
  timeout_seconds: 20
  seed: 2026

models:
  - name: base
    model_path: models/Qwen/Qwen2.5-7B-Instruct
    is_adapter: false

  - name: sft
    model_path: outputs/qwen2.5-7b-stage1-lora
    base_model_path: models/Qwen/Qwen2.5-7B-Instruct
    is_adapter: true

  - name: dpo
    model_path: outputs/qwen2.5-7b-stage1-dpo
    base_model_path: models/Qwen/Qwen2.5-7B-Instruct
    is_adapter: true
