base_model_path: models/Qwen3-8B
model_path: artifacts/qwen3-8b/sft-lora
is_adapter: true
dataset_path: data/external_or/splits/rollout_questions.jsonl
output_path: runs/qwen3_8b/rollouts/real_rollouts.jsonl
run_root: runs
run_prefix: rollout_qwen3_8b

num_return_sequences: 3
max_new_tokens: 1792
temperature: 0.55
top_p: 0.9
do_sample: true
load_in_4bit: true
use_cache_for_generation: true
timeout_seconds: 35
seed: 2026
teacher_evaluation: false
resume_from_checkpoint: true
state_file: rollout_state.json
monitor_success_rate: true
max_consecutive_zero_success: 3
stop_on_consecutive_zero_success: true
zero_success_alert_file: zero_success_alerts.jsonl

genprm_evaluation: false
genprm_min_correct_steps: 8
genprm_require_all_correct: false
genprm_max_tokens: 4200
genprm_teacher:
  teacher_backend: qwen_rag
  teacher_model_path: models/Qwen3-8B
  teacher_load_in_4bit: true
  teacher_enable_thinking: false
  use_bf16_if_available: true
  rag_index_dir: data/rag/or_books
  rag_candidate_top_k: 40
  rag_top_k: 5
  rag_max_context_chars: 4200
  rag_context_max_chunk_chars: 900
  rag_use_semantic_rerank: true
  rag_reranker_model: models/msmarco-minilm-reranker
  rag_reranker_batch_size: 16
  rag_reranker_max_length: 256
  rag_rerank_keyword_blend: 0.62
  rag_modeling_boost: 0.12
  rag_fail_on_reranker_error: false
