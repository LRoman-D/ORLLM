[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orllm-qwen3-stage"
version = "0.1.0"
description = "Qwen3-8B OR modeling loop with RAG teacher, OR-Tools execution, GenPRM audit, SFT, and DPO."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex" }]
dependencies = [
    "ortools>=9.10",
    "PyYAML>=6.0.1",
    "typer>=0.12.3",
    "tqdm>=4.66.4",
    "requests>=2.32.3",
    "matplotlib>=3.8.4",
    "pypdf>=4.3.1",
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
    "trl>=0.10.1",
    "sentencepiece>=0.2.0",
    "bitsandbytes>=0.43.1; platform_system == 'Linux'",
]

[project.scripts]
steporlm-local = "steporlm_stage1.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
